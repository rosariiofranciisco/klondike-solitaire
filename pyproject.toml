[project]
name = "klondike-solitaire"
version = "0.1.0"
description = "Klondike Solitaire card game implemented in Python"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pygame>=2.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"